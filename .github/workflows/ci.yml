name: Seshat CI

"on":
  pull_request:
  push:
    branches: [main]

concurrency:
  group: seshat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test runner
        run: python -m pip install pytest
      - name: Run Python tests
        run: python -m pytest tests -q

  docker-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/hohsiang-lab/seshat
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.architecture }}
      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          case "$digest" in
            sha256:*) ;;
            *) exit 1 ;;
          esac
          digest_value="${digest#sha256:}"
          [[ "$digest_value" =~ ^[0-9a-f]{64}$ ]]
          touch "$RUNNER_TEMP/digests/$digest_value"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/hohsiang-lab/seshat
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and publish latest manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=(*)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --metadata-file "$RUNNER_TEMP/manifest-metadata.json" \
            "${sources[@]}"
      - name: Record published digest
        run: |
          set -euo pipefail
          digest="$(jq -er '."containerimage.descriptor".digest // ."containerimage.digest" // empty' \
            "$RUNNER_TEMP/manifest-metadata.json")"
          {
            printf '%s\n' '## Published image'
            printf '%s@%s\n' "${IMAGE}:latest" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published manifest platforms
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "${IMAGE}:latest" > "$RUNNER_TEMP/latest-manifest.json"
          jq -e '
            ([.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length == 1)
            and
            ([.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length == 1)
          ' "$RUNNER_TEMP/latest-manifest.json" >/dev/null
